      --purple-soft: #f3e6ff;
      --purple-bg: #f9f0ff;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --text-muted: #6b7280;
      --success: #059669;
      --danger: #dc2626;
      --font-body: 'Inter', sans-serif;

    }

    body {
      font-family: var(--font-body);

      background: #eff6ff;
      border: 1px solid #bfdbfe;

    @media (max-width: 480px) {

<body>

  <div>
    <div class="header-logo">🦋 Dra. Lucia Kratz</div>
    <div class="header-sub">CRP 09/20590 · Atividade Terapêutica</div>

</div>

<div id="root"></div>

<script>
  // Firebase config
  const firebaseConfig = {

    authDomain: "entrevista-inicial.firebaseapp.com",

    storageBucket: "entrevista-inicial.appspot.com",

<!-- Carregar o app do portal do paciente para reutilizar os componentes -->
<script src="https://luciakratz-arch.github.io/clinica-dra.LuciaKratz/clinica/app.js" type="text/babel" data-type="module"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function Icon({ name, size = 18, style }) {
  const ref = React.useRef(null);
  useEffect(() => {
    try {
      if (!ref.current || !window.lucide) return;
      ref.current.innerHTML = "";
      const n = name.replace(/-([a-z])/g, (_, l) => l.toUpperCase()).replace(/^./, s => s.toUpperCase());
      const fn = lucide[n];
      if (!fn) return;
      const ic = lucide.createElement(fn);
      if (ic) {
        ic.setAttribute("width", size);
        ic.setAttribute("height", size);
        ic.setAttribute("stroke-width", "1.8");
        ref.current.appendChild(ic);
      }
    } catch (e) {}
  }, [name, size]);
  return <span ref={ref} style={{ display: "inline-flex", alignItems: "center", ...(style || {}) }} />;
}

function AppFerramenta() {
  const [estado, setEstado] = useState("carregando"); // carregando | ferramenta | fabula | psicoeducacao | erro
  const [dados, setDados] = useState(null);     // doc do link
  const [recurso, setRecurso] = useState(null); // doc do recurso (ferramenta/fábula/psico)
  const [paciente, setPaciente] = useState(null);
  const [concluido, setConcluido] = useState(false);

  const token = new URLSearchParams(window.location.search).get("token");

  useEffect(() => {
    if (!token) { setEstado("erro"); return; }
    carregarDados();
  }, []);

  async function carregarDados() {
    try {
      // Buscar link pelo token
      const snap = await db.collection("clinica_links_partilhados")
        .where("token", "==", token)
        .limit(1)
        .get();

      if (snap.empty) { setEstado("erro"); return; }

      const linkDoc = { id: snap.docs[0].id, ...snap.docs[0].data() };
      setDados(linkDoc);

      // Buscar paciente
      if (linkDoc.pacienteId) {
        const pacSnap = await db.collection("clinica_pacientes").doc(linkDoc.pacienteId).get();
        if (pacSnap.exists) setPaciente({ id: pacSnap.id, ...pacSnap.data() });
      }

      const tipo = linkDoc.tipo || "ferramenta";
      // tipoFerramenta é "ferramenta:ID" ou "fabula:ID" ou "psicoeducacao:ID"
      const partes = (linkDoc.tipoFerramenta || "").split(":");
      const recursoId = partes.slice(1).join(":");

      if (tipo === "ferramenta") {
        // Buscar recurso em clinica_recursos
        const rSnap = await db.collection("clinica_recursos").doc(recursoId).get();
        if (rSnap.exists) {
          setRecurso({ id: rSnap.id, ...rSnap.data() });
          setEstado("ferramenta");
        } else {
          // Tentar buscar por formularioKey
          const rSnap2 = await db.collection("clinica_recursos")
            .where("formularioKey", "==", recursoId)
            .limit(1).get();
          if (!rSnap2.empty) {
            setRecurso({ id: rSnap2.docs[0].id, ...rSnap2.docs[0].data() });
          } else {
            // Criar objeto mínimo com o id como formularioKey
            setRecurso({ id: recursoId, formularioKey: recursoId, titulo: linkDoc.nomeRecurso || recursoId });
          }
          setEstado("ferramenta");
        }
      } else if (tipo === "fabula") {
        const fSnap = await db.collection("clinica_fabulas").doc(recursoId).get();
        if (fSnap.exists) {
          setRecurso({ id: fSnap.id, ...fSnap.data() });
          setEstado("fabula");
        } else setEstado("erro");
      } else if (tipo === "psicoeducacao") {
        const pSnap = await db.collection("clinica_psicoeducacao").doc(recursoId).get();
        if (pSnap.exists) {
          setRecurso({ id: pSnap.id, ...pSnap.data() });
          setEstado("psicoeducacao");
        } else setEstado("erro");
      } else {
        setEstado("erro");
      }
    } catch (e) {
      console.error(e);
      setEstado("erro");
    }
  }

  async function marcarRespondido() {
    if (!dados?.id) return;
    try {
      await db.collection("clinica_links_partilhados").doc(dados.id).update({
        status: "respondido",
        respondidoEm: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (e) {}
  }

  const nomePaciente = paciente?.nome?.split(" ")[0] || dados?.pacienteNome?.split(" ")[0] || "você";
  const user = paciente ? { ...paciente } : { id: dados?.pacienteId, nome: dados?.pacienteNome };

  if (estado === "carregando") return (
    <div className="container">
      <div className="card" style={{ textAlign: "center", padding: 40 }}>
        <div className="spinner"/>
        <div style={{ color: "var(--text-muted)", fontSize: 14 }}>Carregando sua atividade...</div>
      </div>
    </div>
  );

  if (estado === "erro") return (
    <div className="container">
      <div className="card" style={{ textAlign: "center", padding: 40 }}>
        <div style={{ fontSize: 48, marginBottom: 16 }}>😕</div>
        <div style={{ fontWeight: 700, fontSize: 18, marginBottom: 8 }}>Link não encontrado</div>
        <div style={{ color: "var(--text-muted)", fontSize: 14, lineHeight: 1.6 }}>
          Este link pode ter expirado ou sido substituído por um novo.<br/>
          Entre em contato com a Dra. Lucia Kratz para receber um novo link.
        </div>
      </div>
    </div>
  );

  if (concluido) return (
    <div className="container">
      <div className="card" style={{ textAlign: "center", padding: 40 }}>
        <div style={{ fontSize: 52, marginBottom: 16 }}>✅</div>
        <div style={{ fontFamily: "var(--font-display)", fontSize: 22, color: "var(--purple)", marginBottom: 8 }}>
          Muito bem, {nomePaciente}!
        </div>
        <div style={{ color: "var(--text-muted)", fontSize: 14, lineHeight: 1.7 }}>
          Sua resposta foi registrada e a Dra. Lucia já pode visualizar no prontuário.<br/>
          Pode fechar esta janela. 💜
        </div>
      </div>
    </div>
  );

  return (
    <div className="container">
      {/* Aviso de login */}
      <div className="aviso-login">
        💡 <strong>Dica:</strong> Faça login no app para ver seu histórico de registros e acompanhar seu progresso terapêutico.
        <a href="https://luciakratz-arch.github.io/clinica-dra.LuciaKratz/clinica/" 
           style={{ color: "var(--purple)", fontWeight: 600, marginLeft: 4 }}>
          Acessar o app →
        </a>
      </div>

      {/* Renderizar ferramenta */}
      {estado === "ferramenta" && recurso && (
        <FerramentaPublica
          recurso={recurso}
          user={user}
          onConcluido={() => { marcarRespondido(); setConcluido(true); }}
        />
      )}

      {/* Renderizar fábula */}
      {estado === "fabula" && recurso && (
        <FabulaPublica
          fabula={recurso}
          user={user}
          onConcluido={() => { marcarRespondido(); setConcluido(true); }}
        />
      )}

      {/* Renderizar psicoeducação */}
      {estado === "psicoeducacao" && recurso && (
        <PsicoeducacaoPublica
          item={recurso}
          user={user}
          onConcluido={() => { marcarRespondido(); setConcluido(true); }}
        />
      )}
    </div>
  );
}

// ── Ferramenta pública ────────────────────────────────────────────────────────
function FerramentaPublica({ recurso, user, onConcluido }) {
  const k = recurso?.formularioKey || "";

  // Ferramentas interativas existentes no portal
  if (k === "breathing-478")        return <FerramentaRespiracao user={user}/>;
  if (k === "muscle-relaxation")    return <FerramentaRelaxamento user={user}/>;
  if (k === "anxiety-management")   return <FerramentaGestaoAnsiedade user={user}/>;
  if (k === "decision-tree")        return <FerramentaArvore user={user}/>;
  if (k === "analise-cadeia" && typeof FerramentaChainAnalysis !== "undefined")
    return <FerramentaChainAnalysis user={user}/>;
  if (k === "ativacao-comportamental" && typeof FerramentaBehavioralActivation !== "undefined")
    return <FerramentaBehavioralActivation user={user}/>;
  if (k === "kit-sos-tipp" && typeof FerramentaTIPP !== "undefined")
    return <FerramentaTIPP user={user}/>;
  if (k === "pausa-estrategica" && typeof FerramentaStrategicPause !== "undefined")
    return <FerramentaStrategicPause user={user}/>;
  if (k === "diario-autocompaixao" && typeof FerramentaSelfCompassion !== "undefined")
    return <FerramentaSelfCompassion user={user}/>;
  if (k === "registro-cnv" && typeof FerramentaCNV !== "undefined")
    return <FerramentaCNV user={user}/>;
  if (k === "mapa-limites" && typeof FerramentaLimitsMap !== "undefined")
    return <FerramentaLimitsMap user={user}/>;
  if (k === "carga-mental" && typeof FerramentaMentalLoad !== "undefined")
    return <FerramentaMentalLoad user={user}/>;
  if (k === "ciclo-conflito" && typeof FerramentaConflictCycle !== "undefined")
    return <FerramentaConflictCycle user={user}/>;
  if (k === "escuta-ativa" && typeof FerramentaActiveListening !== "undefined")
    return <FerramentaActiveListening user={user}/>;
  if (k === "mural-habilidades")    return <FerramentaMuralHabilidades user={user}/>;
  if (k === "diagnostico-macroatividades") return <FerramentaDiagnosticoMacro user={user}/>;
  if (k === "roda-vida-integral")   return <FerramentaRodaVidaIntegral user={user}/>;
  if (k === "emotional-eating")     return <FerramentaRastreamento user={user}/>;
  if (k === "treino-neuro-auditivo") return <FerramentaTreino user={user}/>;
  if (k === "abc-record")           return <FerramentaABC user={user}/>;

  // Fallback: conteúdo genérico
  return (
    <div className="card">
      <div style={{ textAlign: "center", padding: "16px 0 24px" }}>
        <div style={{ fontSize: 48, marginBottom: 12 }}>🧠</div>
        <div style={{ fontFamily: "var(--font-display)", fontSize: 20, color: "var(--purple)", marginBottom: 6 }}>
          {recurso.titulo}
        </div>
        {recurso.descricao && (
          <div style={{ fontSize: 14, color: "var(--text-muted)", lineHeight: 1.6 }}>{recurso.descricao}</div>
        )}
      </div>
      {recurso.conteudo && (
        <div style={{ fontSize: 14, lineHeight: 1.8, whiteSpace: "pre-wrap", marginBottom: 20 }}>
          {recurso.conteudo}
        </div>
      )}
      <button className="btn btn-purple" style={{ width: "100%" }} onClick={onConcluido}>
        ✓ Concluído
      </button>
    </div>
  );
}

// ── Fábula pública ─────────────────────────────────────────────────────────────
function FabulaPublica({ fabula, user, onConcluido }) {
  const [idx, setIdx] = useState(0);
  const [respostas, setRespostas] = useState({});
  const [etapa, setEtapa] = useState("leitura"); // leitura | reflexao | fim
  const paginas = fabula.paginas || [];
  const perguntas = fabula.perguntas || [];

  async function salvar() {
    if (user?.id) {
      try {
        await db.collection("clinica_reflexoes").add({
          pacienteId: user.id,
          pacienteNome: user.nome || "",
          fabulaId: fabula.id || "",
          fabulaTitulo: fabula.titulo || "",
          registros: perguntas.map((p, i) => ({ pergunta: p, resposta: respostas[i] || "" })),
          data: new Date().toLocaleDateString("pt-BR"),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) {}
    }
    onConcluido();
  }

  if (etapa === "reflexao") return (
    <div className="card">
      <div style={{ fontWeight: 700, fontSize: 16, color: "var(--purple)", marginBottom: 4 }}>
        💭 Reflexões — {fabula.titulo}
      </div>
      <div style={{ fontSize: 13, color: "var(--text-muted)", marginBottom: 20 }}>
        Responda com calma. Não há resposta certa ou errada.
      </div>
      {perguntas.map((p, i) => (
        <div key={i} style={{ marginBottom: 16 }}>
          <label className="form-label">{i + 1}. {p}</label>
          <textarea className="form-input" rows={3}
            value={respostas[i] || ""}
            onChange={e => setRespostas(r => ({ ...r, [i]: e.target.value }))}
            placeholder="Escreva sua reflexão aqui..."
          />
        </div>
      ))}
      <button className="btn btn-purple" style={{ width: "100%" }} onClick={salvar}>
        💾 Salvar reflexões
      </button>
    </div>
  );

  return (
    <div>
      <div className="card" style={{ background: "var(--purple)", color: "white", textAlign: "center", padding: "24px 20px" }}>
        <div style={{ fontSize: 48, marginBottom: 8 }}>{fabula.emoji || "📖"}</div>
        <div style={{ fontFamily: "var(--font-display)", fontSize: 22, marginBottom: 6 }}>{fabula.titulo}</div>
        {fabula.moral && <div style={{ fontSize: 13, fontStyle: "italic", opacity: 0.9 }}>"{fabula.moral}"</div>}
        <div style={{ fontSize: 11, opacity: 0.7, marginTop: 8 }}>
          Página {idx + 1} de {paginas.length}
        </div>
      </div>

      {paginas[idx] && (
        <div className="card">
          <div style={{ fontSize: 14, lineHeight: 1.9, color: "var(--gray-700)" }}>{paginas[idx]}</div>
        </div>
      )}

      <div style={{ display: "flex", gap: 10 }}>
        {idx > 0 && (
          <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setIdx(i => i - 1)}>
            ← Anterior
          </button>
        )}
        {idx < paginas.length - 1 ? (
          <button className="btn btn-purple" style={{ flex: 2 }} onClick={() => setIdx(i => i + 1)}>
            Próxima página →
          </button>
        ) : (
          <button className="btn btn-purple" style={{ flex: 2 }}
            onClick={() => perguntas.length > 0 ? setEtapa("reflexao") : onConcluido()}>
            {perguntas.length > 0 ? "💭 Responder reflexões →" : "✓ Concluído"}
          </button>
        )}
      </div>
    </div>
  );
}

// ── Psicoeducação pública ──────────────────────────────────────────────────────
function PsicoeducacaoPublica({ item, user, onConcluido }) {
  const [respostas, setRespostas] = useState(["", "", ""]);
  const perguntas = item.perguntas || [
    "O que mais te marcou neste conteúdo?",
    "Como isso se conecta com algo que você vive hoje?",
    "Que pequena mudança você pode tentar esta semana?"
  ];

  async function salvar() {
    if (user?.id) {
      try {
        await db.collection("clinica_reflexoes").add({
          pacienteId: user.id,
          pacienteNome: user.nome || "",
          psicoeducacaoId: item.id || "",
          psicoeducacaoTitulo: item.titulo || "",
          registros: perguntas.map((p, i) => ({ pergunta: p, resposta: respostas[i] || "" })),
          data: new Date().toLocaleDateString("pt-BR"),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) {}
    }
    onConcluido();
  }

  return (
    <div>
      <div className="card" style={{ background: "var(--purple)", color: "white", textAlign: "center", padding: "24px 20px" }}>
        <div style={{ fontSize: 48, marginBottom: 8 }}>{item.emoji || "📚"}</div>
        <div style={{ fontFamily: "var(--font-display)", fontSize: 22, marginBottom: 6 }}>{item.titulo}</div>
        {item.descricao && <div style={{ fontSize: 13, opacity: 0.85 }}>{item.descricao}</div>}
      </div>

      {item.conteudo && (
        <div className="card">
          <div style={{ fontSize: 14, lineHeight: 1.8, whiteSpace: "pre-wrap" }}>{item.conteudo}</div>
        </div>
      )}

      <div className="card">
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 4, color: "var(--purple)" }}>
          💭 Reflexões
        </div>
        <div style={{ fontSize: 13, color: "var(--text-muted)", marginBottom: 16 }}>
          Responda com calma — suas respostas vão para o seu prontuário.
        </div>
        {perguntas.map((p, i) => (
          <div key={i} style={{ marginBottom: 16 }}>
            <label className="form-label">{i + 1}. {p}</label>
            <textarea className="form-input" rows={3}
              value={respostas[i]}
              onChange={e => setRespostas(r => { const n = [...r]; n[i] = e.target.value; return n; })}
              placeholder="Escreva sua reflexão aqui..."
            />
          </div>
        ))}
        <button className="btn btn-purple" style={{ width: "100%" }} onClick={salvar}>
          💾 Salvar e concluir
        </button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AppFerramenta/>);
</script>
</body>
</html>
