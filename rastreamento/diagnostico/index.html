// ── Montar perguntas a partir dos módulos selecionados ────────────
function montarPerguntas(modulos) {
  const idsVistos = new Set();
  const lista = [];
  modulos.forEach(mod => {
    const pergs = BANCO[mod] || [];
    pergs.forEach(p => {
      if (!idsVistos.has(p.id)) {
        idsVistos.add(p.id);
        lista.push({...p, modulo: mod});
      }
    });
  });
  return lista;
}

// ── Calcular resultado TEA (lógica de espectro) ──────────────────
function calcularTEA(respostas) {
  const pergs = BANCO["tea"] || [];
  const label = LABELS["tea"];

  // Critério A — todos os 4 devem ter pelo menos B
  const crA = ["teaA1","teaA2","teaA3","teaA4"];
  const crAc = crA.filter(id => respostas[id] === "C").length;
  const crAb = crA.filter(id => respostas[id] === "B").length;
  const crA_ok = crA.every(id => respostas[id] === "C" || respostas[id] === "B");
  const crA_pleno = crA.every(id => respostas[id] === "C");

  // Critério B — mínimo 2 em C
  const crB = ["teaB1","teaB2","teaB3","teaB4"];
  const crBc = crB.filter(id => respostas[id] === "C").length;
  const crB_ok = crBc >= 2;

  // Critério C — início precoce
  const crC_ok = respostas["teaC1"] === "C" || respostas["teaC1"] === "B";

  // Critério D — prejuízo funcional
  const crD_ok = respostas["teaD1"] === "C" || respostas["teaD1"] === "B";

  // Nível de suporte
  let nivel = null;
  if (respostas["teaE3"] === "C") nivel = 3;
  else if (respostas["teaE2"] === "C") nivel = 2;
  else if (respostas["teaE1"] === "C") nivel = 1;

  const criteriosFechados = crA_ok && crB_ok && crC_ok && crD_ok;
  const criteriosPlenos   = crA_pleno && crB_ok && crC_ok && crD_ok;

  let status, cor, obs;
  if (criteriosPlenos && nivel) {
    status = `⚠ Critérios TEA — Nível ${nivel} de suporte`;
    cor = "#dc2626";
    obs = `Critério A: ${crAc}/4 C ✓ | Critério B: ${crBc}/4 C ✓ | Início precoce ✓ | Prejuízo funcional ✓ | Nível ${nivel} de suporte`;
  } else if (criteriosFechados) {
    status = "🔍 Critérios presentes (alguns B) — avaliar com instrumentos formais";
    cor = "#d97706";
    obs = `Critério A: ${crAc} C + ${crAb} B / Critério B: ${crBc} C ≥2 ✓ | Recomenda-se avaliação neuropsicológica formal`;
  } else if (crA_ok || crBc >= 1) {
    status = "🔍 Sinais parciais — a observar";
    cor = "#d97706";
    obs = `Critério A: ${crAc} C + ${crAb} B de 4 | Critério B: ${crBc} de 4 | Abaixo do limiar diagnóstico, mas relevante clinicamente`;
  } else {
    status = "✅ Abaixo do limiar";
    cor = "#16a34a";
    obs = "Não atingiu os critérios mínimos do Critério A ou B do TEA";
  }

  const nC = pergs.filter(p => respostas[p.id] === "C").length;
  const nB = pergs.filter(p => respostas[p.id] === "B").length;
  return { mod:"tea", label, nC, nB, total: pergs.length, minC: 8, status, cor, obs };
}

// ── Calcular resultado por transtorno ────────────────────────────
function calcularResultados(modulos, respostas) {
  return modulos.map(mod => {
    // TEA tem lógica especial de espectro
    if (mod === "tea") return calcularTEA(respostas);

    const pergs = BANCO[mod] || [];
    const nC = pergs.filter(p => respostas[p.id] === "C").length;
    const nB = pergs.filter(p => respostas[p.id] === "B").length;
    const lim = LIMIARES[mod] || {minC:3, total:pergs.length, obs:""};
    const label = LABELS[mod] || mod;
    let status, cor;
    if (nC >= lim.minC) { status = "⚠ Critérios atingidos"; cor = "#dc2626"; }
    else if (nC >= Math.ceil(lim.minC * 0.6)) { status = "🔍 Abaixo do limiar — a observar"; cor = "#d97706"; }
    else { status = "✅ Abaixo do limiar"; cor = "#16a34a"; }
    return { mod, label, nC, nB, total: pergs.length, minC: lim.minC, status, cor, obs: lim.obs };
  });
}

    <div class="tipo-grid">
      <div class="tipo-btn ${tipoRespondente==='paciente'?'sel':''}" onclick="selecionarTipo('paciente')">
        <div class="ico">🙋</div>
        <div class="t">O próprio paciente</div>
        <div class="d">Você é a pessoa avaliada</div>
      </div>
      <div class="tipo-btn ${tipoRespondente==='familiar'?'sel':''}" onclick="selecionarTipo('familiar')">
        <div class="ico">👨‍👩‍👧</div>
        <div class="t">Familiar / pessoa próxima</div>
        <div class="d">Você conhece bem o avaliado</div>
      </div>
    </div>
    <div id="camposFamiliar" style="display:${tipoRespondente==='familiar'?'block':'none'}">
      <div class="fg">
        <label class="lbl">Seu nome</label>
        <input id="nomeResp" type="text" placeholder="Seu nome completo" value="${nomeRespondente}" oninput="nomeRespondente=this.value"/>
      </div>
      <div class="fg">
        <label class="lbl">Parentesco / relação</label>
        <input id="parentescoResp" type="text" placeholder="Ex: mãe, cônjuge, amigo(a)" value="${parentesco}" oninput="parentesco=this.value"/>
      </div>
    </div>
    <button class="btn-start" onclick="iniciar()">Começar questionário →</button>`;
}

function selecionarTipo(t) {
  tipoRespondente = t;
  render();
}

function iniciar() {
  if (!tipoRespondente) { alert("Selecione quem está respondendo."); return; }
  if (tipoRespondente === "familiar" && !nomeRespondente.trim()) { alert("Informe seu nome."); return; }
  etapa = "respondendo";
  paginaAtual = 0;
  render();
}

function renderPerguntas(app) {
  const inicio = paginaAtual * POR_PAGINA;
  const fim = Math.min(inicio + POR_PAGINA, PERGUNTAS.length);
  const pagPergs = PERGUNTAS.slice(inicio, fim);
  const totalPags = Math.ceil(PERGUNTAS.length / POR_PAGINA);
  const progresso = Math.round((paginaAtual / totalPags) * 100);
  const ultimaPagina = fim >= PERGUNTAS.length;

  let html = `
    <div class="progress-wrap">
      <div class="progress-labels">
        <span>Questão ${inicio+1}–${fim} de ${PERGUNTAS.length}</span>
        <span>${progresso}% concluído</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progresso}%"></div></div>
    </div>`;

  pagPergs.forEach((p, i) => {
    const n = inicio + i + 1;
    const resp = RESPOSTAS[p.id];
    html += `
      <div class="pergunta-card">
        <div class="perg-num">Questão ${n}</div>
        <div class="perg-texto">${p.texto}</div>
        <div class="opcoes">
          ${[
            {val:"N", label:"Nunca", desc:"Não ocorre ou não se aplica"},
            {val:"B", label:"Às vezes", desc:"Ocorre ocasionalmente"},
            {val:"C", label:"Frequentemente", desc:"Ocorre na maior parte do tempo"},
          ].map(op => `
            <label class="opcao ${resp===op.val?'sel':''}" onclick="responder('${p.id}','${op.val}');this.classList.add('sel');this.parentNode.querySelectorAll('.opcao').forEach(o=>o!==this&&o.classList.remove('sel'))">
              <input type="radio" name="${p.id}" value="${op.val}" ${resp===op.val?'checked':''}/>
              <div class="letra">${op.val}</div>
              <div><strong>${op.label}</strong> — ${op.desc}</div>
            </label>`).join("")}
        </div>
      </div>`;
  });

  // Observações na última página
  if (ultimaPagina) {
    html += `
      <div class="obs-field">
        <label class="lbl">Observações adicionais (opcional)</label>
        <textarea id="obsFinais" placeholder="Alguma informação que considere importante adicionar…" oninput="obsFinaisVal=this.value">${window.obsFinaisVal||""}</textarea>
      </div>`;
  }

  html += `
    <div class="nav">
      ${paginaAtual > 0 ? `<button class="btn btn-back" onclick="voltarPag()">← Voltar</button>` : ""}
      <button class="btn btn-next" onclick="${ultimaPagina?'enviar()':'avancarPag()'}" ${paginaAtual===0&&!tipoRespondente?'disabled':''}>
        ${ultimaPagina ? "✓ Enviar respostas" : "Próxima →"}
      </button>
    </div>`;

  app.innerHTML = html;
}

function responder(id, val) {
  RESPOSTAS[id] = val;
}

function avancarPag() {
  const inicio = paginaAtual * POR_PAGINA;
  const fim = Math.min(inicio + POR_PAGINA, PERGUNTAS.length);
  const pagPergs = PERGUNTAS.slice(inicio, fim);
  const semResposta = pagPergs.filter(p => !RESPOSTAS[p.id]);
  if (semResposta.length > 0) {
    alert(`Por favor, responda todas as questões antes de continuar.\n(${semResposta.length} questão(ões) sem resposta)`);
    return;
  }
  paginaAtual++;
  window.scrollTo(0,0);
  render();
}

function voltarPag() {
  paginaAtual--;
  window.scrollTo(0,0);
  render();
}

function enviar() {
  const semResposta = PERGUNTAS.filter(p => !RESPOSTAS[p.id]);
  if (semResposta.length > 0) {
    alert(`Por favor, responda todas as questões antes de enviar.\n(${semResposta.length} questão(ões) sem resposta)`);
    return;
  }

  const resultados = calcularResultados(CONFIG.modulos, RESPOSTAS);
  const doc = {
    token: TOKEN,
    pacienteNome: CONFIG.pacienteNome || "",
    grupo: CONFIG.grupo || "",
    grupoLabel: CONFIG.grupoLabel || "",
    modulos: CONFIG.modulos,
    tipoRespondente,
    nomeRespondente: tipoRespondente === "familiar" ? nomeRespondente : "",
    parentesco: tipoRespondente === "familiar" ? parentesco : "",
    respostas: RESPOSTAS,
    resultados,
    obsFinais: window.obsFinaisVal || "",
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  };

  // Salvar resposta
  db.collection("clinica_rastreamento_diagnostico").add(doc)
    .then(() => {
      // Marcar token como respondido
      return db.collection("clinica_rastreamento_tokens").doc(TOKEN).update({
        respondidoPor: tipoRespondente,
        respondidoEm: firebase.firestore.FieldValue.serverTimestamp(),
        totalRespondentes: firebase.firestore.FieldValue.increment(1),
      });
    })
    .then(() => {
      etapa = "sucesso";
      render();
    })
    .catch(err => {
      console.error(err);
      alert("Erro ao enviar. Tente novamente.");
    });
}

function renderSucesso(app) {
  app.innerHTML = `
    <div class="success">
      <div class="success-icon">🦋</div>
      <div class="success-title">Respostas enviadas!</div>
      <div class="success-msg">
        Obrigado por responder com atenção e honestidade.<br/>
        Suas respostas foram registradas com segurança e serão analisadas pela<br/>
        <strong>Dra. Lucia Kratz</strong>.<br/><br/>
        Você já pode fechar esta página.
      </div>
    </div>`;
}

// ── Inicialização ─────────────────────────────────────────────────
window.obsFinaisVal = "";

async function init() {
  TOKEN = lerToken();
  if (!TOKEN) {
    etapa = "erro";
    render();
    return;
  }

  try {
    const snap = await db.collection("clinica_rastreamento_tokens").doc(TOKEN).get();
    if (!snap.exists) { etapa = "erro"; render(); return; }

    CONFIG = snap.data();
    // CONFIG deve ter: { modulos: [...], pacienteNome, grupoLabel, grupo }

    PERGUNTAS = montarPerguntas(CONFIG.modulos || []);

    if (PERGUNTAS.length === 0) { etapa = "erro"; render(); return; }

    etapa = "inicio";
    render();
  } catch(e) {
    console.error(e);
    etapa = "erro";
    render();
  }
}

init();
</script>
</body>
</html>
