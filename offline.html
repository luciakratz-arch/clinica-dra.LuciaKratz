<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7B00C4" />
  <title>Sem conexão — Dra. Lucia Kratz</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: linear-gradient(135deg, #3d0070 0%, #7B00C4 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
      color: white; text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 380px; width: 100%; }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 18px; color: rgba(255,255,255,0.8);
      margin-bottom: 32px;
    }
    .icone { font-size: 56px; margin-bottom: 20px; opacity: 0.8; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px; font-weight: 600; margin-bottom: 12px;
    }
    p { font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.7; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      background: white; color: #7B00C4;
      padding: 14px 32px; border-radius: 50px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; border: none; font-family: inherit;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      transition: opacity .2s;
    }
    .btn:hover { opacity: 0.9; }
    .hint { margin-top: 20px; font-size: 12px; color: rgba(255,255,255,0.35); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🦋 Dra. Lucia Kratz</div>
    <div class="icone">📡</div>
    <h1>Sem conexão</h1>
    <p>Verifique sua internet e tente novamente para acessar o portal da paciente.</p>
    <button class="btn" onclick="window.location.reload()">🔄 Tentar novamente</button>
    <p class="hint">Quando a conexão voltar, o app retoma normalmente.</p>
  </div>
</body>
</html>
