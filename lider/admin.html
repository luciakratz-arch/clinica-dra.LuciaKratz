<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel da Facilitadora — Líd@r 5.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f4f6f4;color:#1a2e1a;min-height:100vh}

/* HEADER */
header{background:linear-gradient(135deg,#14532d 0%,#16a34a 100%);border-bottom:3px solid #15803d;padding:20px 24px 24px}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-left{}
.logo-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
#logo-lucia{height:44px;object-fit:contain;display:block}
#sep-logos{display:none;width:1px;height:36px;background:rgba(255,255,255,0.35);margin:0 4px}
#logo-cbco{height:40px;object-fit:contain;display:none}
h1{color:#fff;font-size:1.7rem;font-weight:700;letter-spacing:-0.5px}
.subtitle{color:#bbf7d0;font-size:0.95rem;font-weight:500;margin-top:3px}
.back-link{color:#d1fae5;font-size:0.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-top:8px;opacity:0.85}
.back-link:hover{opacity:1;text-decoration:underline}

/* MAIN */
main{max-width:1100px;margin:0 auto;padding:28px 20px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:28px}
.stat-card{background:#fff;border-radius:10px;padding:12px 10px;text-align:center;border:1.5px solid #d1fae5;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s}
.stat-card:hover,.stat-card.active{border-color:#16a34a;box-shadow:0 2px 12px rgba(22,163,74,0.15)}
.stat-card.active{background:#f0fdf4}
.stat-count{font-size:1.6rem;font-weight:700;color:#15803d;line-height:1}
.stat-label{font-size:0.72rem;font-weight:600;color:#4b5563;margin-top:4px;text-transform:uppercase;letter-spacing:0.03em}

/* FILTERS */
.filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;align-items:center}
.filters select,.filters input{padding:9px 14px;border:1.5px solid #d1fae5;border-radius:8px;font-family:'Inter',sans-serif;font-size:0.88rem;color:#1a2e1a;background:#fff;outline:none;transition:border-color 0.15s}
.filters select:focus,.filters input:focus{border-color:#16a34a}
.filters select{min-width:180px}
.filters input{min-width:200px;flex:1}
.btn-export{margin-left:auto;background:#15803d;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-family:'Inter',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;transition:background 0.15s}
.btn-export:hover{background:#166534}

/* COUNT */
.count-bar{font-size:0.85rem;color:#374151;margin-bottom:14px;font-weight:500}
.count-bar span{color:#15803d;font-weight:700}

/* CARDS */
.response-card{background:#fff;border:1.5px solid #d1fae5;border-radius:12px;padding:16px 18px;margin-bottom:12px;transition:border-color 0.15s}
.response-card:hover{border-color:#86efac}
.card-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.form-badge{font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:0.04em;white-space:nowrap}
.resp-name{font-weight:700;font-size:0.95rem;color:#1a2e1a}
.resp-wpp{font-size:0.83rem;color:#6b7280;margin-left:4px}
.resp-date{font-size:0.78rem;color:#9ca3af;margin-left:auto}
.btn-expand{background:none;border:1.5px solid #d1fae5;color:#15803d;font-family:'Inter',sans-serif;font-size:0.78rem;font-weight:600;padding:4px 12px;border-radius:20px;cursor:pointer;margin-left:8px;transition:background 0.15s,border-color 0.15s;white-space:nowrap}
.btn-expand:hover{background:#f0fdf4;border-color:#86efac}
.btn-wa{display:inline-block;background:#25d366;color:#fff;border:none;font-family:'Inter',sans-serif;font-size:0.78rem;font-weight:600;padding:4px 12px;border-radius:20px;cursor:pointer;margin-left:8px;text-decoration:none;white-space:nowrap;transition:background 0.15s}
.btn-wa:hover{background:#128c48}
.btn-del{display:inline-block;background:#fee2e2;color:#dc2626;border:1.5px solid #fca5a5;font-family:'Inter',sans-serif;font-size:0.78rem;font-weight:600;padding:4px 10px;border-radius:20px;cursor:pointer;margin-left:8px;white-space:nowrap;transition:background 0.15s}
.btn-del:hover{background:#fecaca;border-color:#f87171}
.card-detail{display:none;margin-top:14px;border-top:1px solid #d1fae5;padding-top:12px}
.card-detail.open{display:block}
.detail-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #f3f4f6;font-size:0.83rem}
.detail-key{font-weight:600;color:#374151;min-width:160px;flex-shrink:0}
.detail-val{color:#4b5563;word-break:break-word}

/* LOADING / EMPTY */
.loading{text-align:center;padding:48px 20px;color:#6b7280;font-size:0.9rem}
.empty{text-align:center;padding:48px 20px;color:#9ca3af;font-size:0.88rem}

/* BADGE COLORS */
.badge-w1{background:#dbeafe;color:#1d4ed8}
.badge-w2{background:#ede9fe;color:#6d28d9}
.badge-w3{background:#dcfce7;color:#15803d}
.badge-w4{background:#ffedd5;color:#c2410c}
</style>

// ── TextAreaVoz ──
function initVoz(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  document.querySelectorAll('textarea').forEach(function(ta){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;display:block';
    ta.parentNode.insertBefore(wrap, ta);
    wrap.appendChild(ta);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = '🎙️';
    btn.title = 'Falar para digitar';
    btn.style.cssText = 'position:absolute;right:6px;bottom:8px;background:#f3e6ff;border:none;border-radius:6px;padding:4px 7px;cursor:pointer;color:#7B00C4;font-size:14px;line-height:1;transition:all .2s;z-index:2';
    wrap.appendChild(btn);
    ta.style.paddingRight = '36px';
    var dot = document.createElement('div');
    dot.style.cssText = 'display:none;font-size:11px;color:#7B00C4;margin-top:3px;align-items:center;gap:4px';
    dot.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:#7B00C4;display:inline-block"></span> Gravando... clique 🎙️ para parar';
    wrap.appendChild(dot);
    var rec = null;
    var gravando = false;
    btn.addEventListener('click', function(){
      if(gravando){
        if(rec) rec.stop();
        gravando = false;
        btn.style.background = '#f3e6ff';
        btn.style.color = '#7B00C4';
        btn.style.boxShadow = 'none';
        dot.style.display = 'none';
        return;
      }
      rec = new SR();
      rec.lang = 'pt-BR';
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = function(e){
        var t = Array.from(e.results).map(function(r){return r[0].transcript;}).join(' ');
        var base = ta.value.replace(/\s*\[\.\.\.]+$/,'').trimEnd();
        ta.value = base ? base + ' ' + t : t;
      };
      rec.onerror = function(){ gravando = false; btn.style.background='#f3e6ff'; btn.style.color='#7B00C4'; dot.style.display='none'; };
      rec.onend = function(){ if(gravando){ gravando=false; btn.style.background='#f3e6ff'; btn.style.color='#7B00C4'; dot.style.display='none'; } };
      rec.start();
      gravando = true;
      btn.style.background = '#7B00C4';
      btn.style.color = 'white';
      btn.style.boxShadow = '0 0 0 3px #7B00C430';
      dot.style.display = 'flex';
    });
  });
}

// Collections map
var COLLECTIONS = {
  'lider_f1_1': {label:'F1.1', badge:'badge-w1'},
  'lider_f1_2': {label:'F1.2', badge:'badge-w1'},
  'lider_f1_3': {label:'F1.3', badge:'badge-w1'},
  'lider_f2_1': {label:'F2.1', badge:'badge-w2'},
  'lider_f2_2': {label:'F2.2', badge:'badge-w2'},
  'lider_f2_3': {label:'F2.3', badge:'badge-w2'},
  'lider_f2_4': {label:'F2.4', badge:'badge-w2'},

  'lider_f3_3': {label:'F3.3', badge:'badge-w3'},
  'lider_f4_1': {label:'F4.1', badge:'badge-w4'},
  'lider_f4_2': {label:'F4.2', badge:'badge-w4'}
};

var allDocs = []; // { col, label, badge, id, data }
var db;

function formatDate(ts){
  if(!ts) return '–';
  var d;
  if(ts.toDate) d = ts.toDate();
  else if(ts.seconds) d = new Date(ts.seconds*1000);
  else d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function badgeClass(col){
  return COLLECTIONS[col] ? COLLECTIONS[col].badge : 'badge-w1';
}
function badgeLabel(col){
  return COLLECTIONS[col] ? COLLECTIONS[col].label : col;
}

function renderVisible(){
  var selCol = document.getElementById('sel-form').value;
  var search = (document.getElementById('search-name').value || '').toLowerCase().trim();
  var filtered = allDocs.filter(function(r){
    if(selCol !== 'all' && r.col !== selCol) return false;
    if(search){
      var name = ((r.data.nome||r.data.name||r.data.participante||'')).toLowerCase();
      if(name.indexOf(search) === -1) return false;
    }
    return true;
  });

  document.getElementById('count-visible').textContent = filtered.length;
  var container = document.getElementById('cards-container');

  if(filtered.length === 0){
    container.innerHTML = '<div class="empty">Nenhuma resposta encontrada.</div>';
    return;
  }

  container.innerHTML = filtered.map(function(r, idx){
    var name = r.data.nome || r.data.name || r.data.participante || '(sem nome)';
    var wpp = r.data.whatsapp || r.data.telefone || r.data.celular || '';
    var date = formatDate(r.data.timestamp || r.data.createdAt || null);

    // Detail fields (exclude timestamp/createdAt)
    var skipKeys = {timestamp:1,createdAt:1};
    var fields = Object.keys(r.data).filter(function(k){ return !skipKeys[k]; });

    var detailRows = fields.map(function(k){
      return '<div class="detail-row"><span class="detail-key">'+esc(k)+'</span><span class="detail-val">'+esc(String(r.data[k]||''))+'</span></div>';
    }).join('');

    var waNum = wpp.replace(/\D/g,'');
    var waBtn = waNum
      ? '<a class="btn-wa" href="#" onclick="enviarRespostas(event,\''+waNum+'\','+idx+')">📲 Enviar respostas</a>'
      : '';

    return '<div class="response-card" id="rc-'+idx+'">'
      +'<div class="card-header">'
      +'<span class="form-badge '+badgeClass(r.col)+'">'+badgeLabel(r.col)+'</span>'
      +'<span class="resp-name">'+esc(name)+'</span>'
      +(wpp?'<span class="resp-wpp">· '+esc(wpp)+'</span>':'')
      +'<span class="resp-date">'+date+'</span>'
      +waBtn
      +'<button class="btn-del" onclick="excluirResposta(event,'+idx+')">🗑️</button>'
      +'<button class="btn-expand" onclick="toggleDetail('+idx+',this)">Ver detalhes ▾</button>'
      +'</div>'
      +'<div class="card-detail" id="cd-'+idx+'">'+detailRows+'</div>'
      +'</div>';
  }).join('');
  initVoz();
}

// Rótulos legíveis por campo
// Nomes legíveis para dimensões do F1.1
// Nomes REAIS das dimensões do F1.1 (extraídos do formulário)
var DIM_NOMES = {
  d1:'D1 — Liderança', d2:'D2 — Desenv. de Pessoas', d3:'D3 — Retenção',
  d4:'D4 — Confiança', d5:'D5 — Delegação', d6:'D6 — Proatividade'
};
// Perguntas de cada dimensão (ordem real do formulário)
var DIM_PERGUNTAS = {
  d1:['Estimulo a participação nas decisões','Estimulo o empowerment','Reconheço minhas falhas e aprendo','Foco em resultados e pessoas','Ensino e oriento minha equipe'],
  d2:['Inovo e me atualizo constantemente','Desafio as pessoas a crescerem','Valorizo o melhor de cada um','Dou feedback regularmente','Reconheço as conquistas das pessoas'],
  d3:['Me realizo com os resultados das pessoas','Cuido das pessoas com respeito','Proporciono crescimento e realização','Valorizo o aprendizado pelo erro','Cumpro minhas promessas'],
  d4:['Digo o que penso com respeito','Comunico a verdade mesmo quando é difícil','Sou exemplo do que prego','Ajo com justiça','Evito assumir tarefas técnicas da equipe'],
  d5:['Estabeleço co-responsabilidade','Analiso tarefa e perfil antes de delegar','Defino prazos e limites claros','Estou disponível sem resolver por elas','Penso nos problemas antes que aconteçam'],
  d6:['Enfrento os problemas de frente','Atuo rapidamente em crises','Antecipo mudanças e me preparo','Supero obstáculos com criatividade']
};

function fmtBool(v){ return v ? '✅ Sim' : '❌ Não'; }
function fmtVal(v){
  if(v === null || v === undefined || v === '') return '';
  if(typeof v === 'boolean') return fmtBool(v);
  if(typeof v === 'object' && v.seconds) return new Date(v.seconds*1000).toLocaleDateString('pt-BR');
  return String(v);
}
function lin(label, val){ var v=fmtVal(val); if(v) return '*'+label+':* '+v; return ''; }
function sec(title){ return '\n*── '+title+' ──*'; }

function formatarMensagem(r){
  var d = r.data;
  var col = r.col;
  var nome = d.nome || d.nomes || '(participante)';
  var label = badgeLabel(col);
  var L = []; // linhas
  L.push('🌱 *Líd@r 5.0 — '+label+'*');
  L.push('Olá, *'+nome+'*! Seguem suas respostas:\n');

  // ── F1.1 — Diagnóstico de Liderança ──
  if(col === 'lider_f1_1'){
    if(d.cargo) L.push(lin('Cargo', d.cargo));
    if(d.setor) L.push(lin('Setor', d.setor));
    if(d.total != null) L.push(lin('Pontuação total', d.total + ' / 154'));
    if(d.categoria) L.push(lin('Perfil', d.categoria));
    // Dimensões com perguntas detalhadas
    ['d1','d2','d3','d4','d5','d6'].forEach(function(dk){
      var arr = d[dk];
      if(!arr || !Array.isArray(arr)) return;
      var soma = arr.reduce(function(a,b){return a+(parseInt(b)||0);},0);
      var max = arr.length * 5;
      L.push(sec(DIM_NOMES[dk]+' — '+soma+'/'+max+' pts'));
      var pergs = DIM_PERGUNTAS[dk] || [];
      arr.forEach(function(nota, qi){
        var pergunta = pergs[qi] || ('Questão '+(qi+1));
        L.push('  '+nota+'/5 — '+pergunta);
      });
    });
    if(d.fortes) L.push(sec('Pontos Fortes')+'\n'+d.fortes);
    if(d.melhoria) L.push(sec('Área de Melhoria')+'\n'+d.melhoria);
    // Metas
    var metas = d.metas;
    if(metas){ try{ if(typeof metas==='string') metas=JSON.parse(metas); }catch(e){} }
    if(Array.isArray(metas) && metas.length){
      L.push(sec('Metas de Desenvolvimento'));
      metas.forEach(function(m,i){
        if(m && m.meta) L.push((i+1)+'. '+m.meta+(m.inicio?' ('+m.inicio+' → '+m.termino+')':''));
      });
    }
  }

  // ── F1.2 — Mapeamento Geracional ──
  else if(col === 'lider_f1_2'){
    if(d.cargo) L.push(lin('Cargo', d.cargo));
    if(d.setor) L.push(lin('Setor', d.setor));
    // Equipe: array de {nome, geracao}
    var eq12 = d.equipe;
    if(eq12){ try{ if(typeof eq12==='string') eq12=JSON.parse(eq12); }catch(e){} }
    if(Array.isArray(eq12) && eq12.length){
      L.push(sec('Equipe ('+eq12.length+' pessoa'+(eq12.length>1?'s':'')+')'));
      // Contagem por geração
      var genCount={};
      eq12.forEach(function(m){ if(m&&m.geracao) genCount[m.geracao]=(genCount[m.geracao]||0)+1; });
      var genTexto=Object.keys(genCount).map(function(g){return genCount[g]+' '+g;}).join(', ');
      if(genTexto) L.push('📊 '+genTexto);
      L.push('');
      eq12.forEach(function(m,i){
        if(!m) return;
        L.push((i+1)+'. *'+(m.nome||'–')+'* — '+(m.geracao||'–'));
      });
    }
    // Pontos fortes: array de {nome, geracao, descricao, importancia}
    var frt12 = d.fortes;
    if(frt12){ try{ if(typeof frt12==='string') frt12=JSON.parse(frt12); }catch(e){} }
    if(Array.isArray(frt12) && frt12.length){
      var frtFilt = frt12.filter(function(f){ return f && f.descricao; });
      if(frtFilt.length){
        L.push(sec('Pontos Fortes da Equipe'));
        frtFilt.sort(function(a,b){return (b.importancia||0)-(a.importancia||0);});
        frtFilt.forEach(function(f){
          L.push('⭐ *'+fmtVal(f.nome)+'* ('+fmtVal(f.geracao)+') — importância '+fmtVal(f.importancia)+'/10');
          L.push('   '+f.descricao);
        });
      }
    } else if(typeof d.fortes==='string' && d.fortes){
      L.push(sec('Pontos Fortes da Equipe')+'\n'+d.fortes);
    }
    // Pontos de melhoria: array de {nome, geracao, descricao, importancia}
    var frk12 = d.fracos;
    if(frk12){ try{ if(typeof frk12==='string') frk12=JSON.parse(frk12); }catch(e){} }
    if(Array.isArray(frk12) && frk12.length){
      var frkFilt = frk12.filter(function(f){ return f && f.descricao; });
      if(frkFilt.length){
        L.push(sec('Áreas de Desenvolvimento'));
        frkFilt.sort(function(a,b){return (b.importancia||0)-(a.importancia||0);});
        frkFilt.forEach(function(f){
          L.push('🔧 *'+fmtVal(f.nome)+'* ('+fmtVal(f.geracao)+') — importância '+fmtVal(f.importancia)+'/10');
          L.push('   '+f.descricao);
        });
      }
    } else if(typeof d.fracos==='string' && d.fracos){
      L.push(sec('Áreas de Desenvolvimento')+'\n'+d.fracos);
    }
  }

  // ── F1.3 — Corda das Soluções (grupo) ──
  else if(col === 'lider_f1_3'){
    var partic = d.participantes;
    if(partic){ try{ if(typeof partic==='string') partic=JSON.parse(partic); }catch(e){} }
    if(Array.isArray(partic) && partic.length){
      L.push('*Participantes:* '+partic.join(', '));
    }
    var trans = d.transformacoes;
    if(trans){ try{ if(typeof trans==='string') trans=JSON.parse(trans); }catch(e){} }
    if(Array.isArray(trans) && trans.length){
      L.push(sec('Transformações'));
      trans.forEach(function(t,i){
        if(t && (t.problema||t.solucao)){
          L.push((i+1)+'. ❌ *Reclamação:* '+fmtVal(t.problema));
          L.push('   ✅ *Solução:* '+fmtVal(t.solucao));
        }
      });
    }
    if(d.comprometimento) L.push(sec('Comprometimento do Grupo')+'\n'+d.comprometimento);
  }

  // ── F2.1 — Autodiagnóstico de Competências ──
  else if(col === 'lider_f2_1'){
    if(d.cargo) L.push(lin('Cargo', d.cargo));
    if(d.setor) L.push(lin('Setor', d.setor));
    if(d.media_geral!=null) L.push(lin('Média geral', d.media_geral));
    L.push(sec('Competências Avaliadas'));
    for(var i=1;i<=15;i++){
      var v=d['char_'+i+'_valor'], ev=d['char_'+i+'_evidencia'];
      var nm=d['char_'+i+'_nome']||(CHAR_NOMES[i-1]||'Competência '+i);
      if(v!=null) L.push('*'+nm+':* '+v+(ev?' — '+ev:''));
    }
    if(d.pontos_fortes) L.push(sec('Pontos Fortes')+'\n'+d.pontos_fortes);
    if(d.gaps) L.push(sec('Gaps Identificados')+'\n'+d.gaps);
    var plano=d.plano_desenvolvimento;
    if(plano){ try{ if(typeof plano==='string') plano=JSON.parse(plano); }catch(e){} }
    if(Array.isArray(plano) && plano.length){
      L.push(sec('Plano de Desenvolvimento'));
      plano.forEach(function(p,i){ if(p) L.push((i+1)+'. '+fmtVal(p)); });
    }
  }

  // ── F2.2 — Matriz GUT ──
  else if(col === 'lider_f2_2'){
    if(d.setor) L.push(lin('Setor', d.setor));
    var gargh = d.gargalos;
    if(gargh){ try{ if(typeof gargh==='string') gargh=JSON.parse(gargh); }catch(e){} }
    if(Array.isArray(gargh) && gargh.length){
      L.push(sec('Matriz GUT'));
      gargh.forEach(function(g,i){
        if(g && g.problema){
          var gut='G:'+fmtVal(g.g)+' U:'+fmtVal(g.u)+' T:'+fmtVal(g.t)+' = '+fmtVal(g.gut);
          L.push((i+1)+'. *'+g.problema+'* → '+gut);
        }
      });
    }
    if(d.acao_prioritaria) L.push(sec('Ação Prioritária')+'\n'+d.acao_prioritaria);
  }

  // ── F2.3 — Trio com Foco (grupo) ──
  else if(col === 'lider_f2_3'){
    var partic = d.participantes;
    if(partic){ try{ if(typeof partic==='string') partic=JSON.parse(partic); }catch(e){} }
    if(Array.isArray(partic) && partic.length){
      L.push(sec('Participantes'));
      partic.forEach(function(p,i){
        if(p && typeof p==='object'){
          var linha=(i+1)+'. *'+(p.nome||'')+'*';
          if(p.setor) linha+=' — '+p.setor;
          L.push(linha);
          if(p.foco) L.push('   📌 Foco: '+p.foco);
          if(p.acao) L.push('   ⚡ Ação: '+p.acao);
          if(p.apoio) L.push('   🤝 Apoio: '+p.apoio);
        } else { L.push((i+1)+'. '+fmtVal(p)); }
      });
    }
  }

  // ── F2.4 — Plano de Ação 5W2H ──
  else if(col === 'lider_f2_4'){
    if(d.setor) L.push(lin('Setor', d.setor));
    L.push(sec('5W2H'));
    if(d.what) L.push('*O quê (What):* '+d.what);
    if(d.why) L.push('*Por quê (Why):* '+d.why);
    if(d.who) L.push('*Quem (Who):* '+d.who);
    if(d.where) L.push('*Onde (Where):* '+d.where);
    if(d.when) L.push('*Quando (When):* '+d.when);
    if(d.how) L.push('*Como (How):* '+d.how);
    if(d.howmuch) L.push('*Quanto custa (How much):* '+d.howmuch);
    if(d.compromisso) L.push(sec('Comprometimento')+'\n'+d.compromisso);
  }

  // ── F3.1 — Grupo STAR (grupo) ──
  else if(col === 'lider_f3_1'){
    var partic = d.participantes;
    if(partic){ try{ if(typeof partic==='string') partic=JSON.parse(partic); }catch(e){} }
    if(Array.isArray(partic) && partic.length){
      L.push('*Total de participantes:* '+partic.length);
      L.push(sec('Participantes e Respostas'));
      partic.forEach(function(p,i){
        if(p && typeof p==='object'){
          var nl=(i+1)+'. *'+(p.nome||'')+'*';
          if(p.setor) nl+=' ('+p.setor+')';
          L.push(nl);
          if(p.situacao) L.push('   📋 Situação: '+p.situacao);
          if(p.tarefa) L.push('   🎯 Tarefa: '+p.tarefa);
          if(p.acao) L.push('   ⚡ Ação: '+p.acao);
          if(p.resultado) L.push('   ✅ Resultado: '+p.resultado);
        }
      });
    }
  }

  // ── F3.2 — Plano de Treinamento ──
  else if(col === 'lider_f3_2'){
    if(d.setor) L.push(lin('Setor', d.setor));
    var diag=d.diagnostico;
    if(diag && typeof diag==='object'){
      L.push(sec('Diagnóstico'));
      if(diag.ineficiencia) L.push('*Ineficiência:* '+diag.ineficiencia);
      if(diag.habilidade_faltando) L.push('*Habilidade faltando:* '+diag.habilidade_faltando);
      if(diag.tempo_perdido) L.push('*Tempo perdido:* '+diag.tempo_perdido);
      if(diag.impacto_treino) L.push('*Impacto esperado:* '+diag.impacto_treino);
    }
    var plano=d.plano;
    if(plano && typeof plano==='object'){
      L.push(sec('Plano de Treinamento'));
      if(plano.habilidade) L.push('*Habilidade:* '+plano.habilidade);
      if(plano.formato) L.push('*Formato:* '+plano.formato);
      if(plano.duracao) L.push('*Duração:* '+plano.duracao);
      if(plano.frequencia) L.push('*Frequência:* '+plano.frequencia);
      if(plano.facilitador) L.push('*Facilitador:* '+plano.facilitador);
      if(plano.data_inicio) L.push('*Início:* '+plano.data_inicio);
      if(plano.indicador) L.push('*Indicador de sucesso:* '+plano.indicador);
    }
  }

  // ── F3.3 — PDCA + Triângulo do Hábito ──
  else if(col === 'lider_f3_3'){
    if(d.setor) L.push(lin('Setor', d.setor));
    if(d.gargalo) L.push(lin('Gargalo principal', d.gargalo));
    var pdca=d.pdca;
    if(pdca && typeof pdca==='object'){
      L.push(sec('PDCA'));
      if(pdca.plan) L.push('*Plan (Planejar):* '+pdca.plan);
      if(pdca.do) L.push('*Do (Executar):* '+pdca.do);
      if(pdca.check) L.push('*Check (Verificar):* '+pdca.check);
      if(pdca.act) L.push('*Act (Ajustar):* '+pdca.act);
    }
    var hab=d.triangulo_habito;
    if(hab && typeof hab==='object'){
      L.push(sec('Triângulo do Hábito'));
      if(hab.gatilho) L.push('*Gatilho:* '+hab.gatilho);
      if(hab.rotina) L.push('*Rotina:* '+hab.rotina);
      if(hab.recompensa) L.push('*Recompensa:* '+hab.recompensa);
    }
  }

  // ── F4.1 — CNV / Feedback ──
  else if(col === 'lider_f4_1'){
    if(d.colaborador) L.push(lin('Colaborador', d.colaborador));
    var cnv=d.cnv;
    if(cnv && typeof cnv==='object'){
      L.push(sec('Comunicação Não Violenta'));
      if(cnv.observacao) L.push('*Observação:* '+cnv.observacao);
      if(cnv.sentimento) L.push('*Sentimento:* '+cnv.sentimento);
      if(cnv.necessidade) L.push('*Necessidade:* '+cnv.necessidade);
      if(cnv.pedido) L.push('*Pedido:* '+cnv.pedido);
    }
    var rot=d.roteiro;
    if(rot && typeof rot==='object'){
      L.push(sec('Roteiro da Conversa'));
      if(rot.data_local) L.push('*Data/Local:* '+rot.data_local);
      if(rot.ambiente_seguro) L.push('*Ambiente seguro:* '+rot.ambiente_seguro);
      if(rot.verificar_compreensao) L.push('*Verificar compreensão:* '+rot.verificar_compreensao);
    }
  }

  // ── F4.2 — Checklist de Feedback ──
  else if(col === 'lider_f4_2'){
    if(d.colaborador) L.push(lin('Colaborador', d.colaborador));
    if(d.data_hora) L.push(lin('Data/Hora', d.data_hora));
    var geo=d.psicogeografia;
    if(geo && typeof geo==='object'){
      L.push(sec('Psicogeografia'));
      if(geo.local_privado!=null) L.push('Local privado: '+fmtBool(geo.local_privado));
      if(geo.posicao_parceria!=null) L.push('Posição de parceria: '+fmtBool(geo.posicao_parceria));
      if(geo.sem_mesa!=null) L.push('Sem mesa entre eles: '+fmtBool(geo.sem_mesa));
      if(geo.celulares_silencio!=null) L.push('Celulares no silêncio: '+fmtBool(geo.celulares_silencio));
      if(geo.horario_adequado!=null) L.push('Horário adequado: '+fmtBool(geo.horario_adequado));
      if(geo.agua_disponivel!=null) L.push('Água disponível: '+fmtBool(geo.agua_disponivel));
      if(geo.local_escolhido) L.push('Local escolhido: '+geo.local_escolhido);
    }
    var prep=d.preparacao;
    if(prep && typeof prep==='object'){
      L.push(sec('Preparação'));
      if(prep.fatos_especificos!=null) L.push('Fatos específicos: '+fmtBool(prep.fatos_especificos));
      if(prep.pessoa_vs_comportamento!=null) L.push('Comportamento ≠ pessoa: '+fmtBool(prep.pessoa_vs_comportamento));
      if(prep.exemplos_concretos!=null) L.push('Exemplos concretos: '+fmtBool(prep.exemplos_concretos));
      if(prep.mudanca_especifica!=null) L.push('Mudança específica: '+fmtBool(prep.mudanca_especifica));
      if(prep.estado_emocional!=null) L.push('Estado emocional ok: '+fmtBool(prep.estado_emocional));
      if(prep.tempo_suficiente!=null) L.push('Tempo suficiente: '+fmtBool(prep.tempo_suficiente));
    }
    var dur=d.durante;
    if(dur && typeof dur==='object'){
      L.push(sec('Durante a Conversa'));
      if(dur.abertura) L.push('*Abertura:* '+dur.abertura);
      if(dur.ponto_forte) L.push('*Ponto forte:* '+dur.ponto_forte);
      if(dur.comportamento) L.push('*Comportamento a mudar:* '+dur.comportamento);
      if(dur.combinado) L.push('*O que foi combinado:* '+dur.combinado);
    }
  }

  L.push('\n_Programa Líd@r 5.0 — CBCO_');
  return L.filter(function(l){ return l!==undefined && l!==null; }).join('\n');
}

function getFiltered(idx){
  var selCol = document.getElementById('sel-form').value;
  var search = (document.getElementById('search-name').value || '').toLowerCase().trim();
  var filtered = allDocs.filter(function(r){
    if(selCol !== 'all' && r.col !== selCol) return false;
    if(search){
      var n = (r.data.nome||r.data.nomes||r.data.name||'').toLowerCase();
      if(n.indexOf(search) === -1) return false;
    }
    return true;
  });
  return filtered[idx] || null;
}

function enviarRespostas(e, waNum, idx){
  e.preventDefault();
  var r = getFiltered(idx);
  if(!r) return;
  var msg = formatarMensagem(r);
  // Trunca se passar de 2000 chars (limite WhatsApp deep link)
  if(msg.length > 1900) msg = msg.substring(0, 1900) + '\n\n_(mensagem truncada)_';
  window.open('https://wa.me/55'+waNum+'?text='+encodeURIComponent(msg), '_blank');
}

function excluirResposta(e, idx){
  e.preventDefault();
  var r = getFiltered(idx);
  if(!r) return;
  var nome = r.data.nome || r.data.name || '(sem nome)';
  if(!confirm('Excluir resposta de "'+nome+'" em '+badgeLabel(r.col)+'?\n\nEssa ação não pode ser desfeita.')) return;
  db.collection(r.col).doc(r.id).delete().then(function(){
    // Remove do array local
    var globalIdx = allDocs.indexOf(r);
    if(globalIdx !== -1) allDocs.splice(globalIdx, 1);
    // Atualiza contador da coleção
    var cnt = COLLECTIONS[r.col] ? document.getElementById('cnt-'+r.col) : null;
    if(cnt) cnt.textContent = Math.max(0, parseInt(cnt.textContent||'0') - 1);
    document.getElementById('cnt-all').textContent = allDocs.length;
    renderVisible();
  }).catch(function(err){
    alert('Erro ao excluir: ' + err.message);
  });
}

function toggleDetail(idx, btn){
  var el = document.getElementById('cd-'+idx);
  if(el.classList.contains('open')){
    el.classList.remove('open');
    btn.textContent = 'Ver detalhes ▾';
  } else {
    el.classList.add('open');
    btn.textContent = 'Fechar ▴';
  }
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function filterByForm(col){
  document.getElementById('sel-form').value = col;
  // Highlight active stat card
  document.querySelectorAll('.stat-card').forEach(function(c){
    c.classList.toggle('active', c.dataset.col === col);
  });
  renderVisible();
}

function onFormSelect(){
  var val = document.getElementById('sel-form').value;
  document.querySelectorAll('.stat-card').forEach(function(c){
    c.classList.toggle('active', c.dataset.col === val);
  });
  renderVisible();
}

function loadAllCollections(){
  var colKeys = Object.keys(COLLECTIONS);
  var pending = colKeys.length;
  allDocs = [];

  function done(){
    pending--;
    if(pending === 0){
      allDocs.sort(function(a,b){
        var ta = (a.data.timestamp && a.data.timestamp.seconds) ? a.data.timestamp.seconds : 0;
        var tb = (b.data.timestamp && b.data.timestamp.seconds) ? b.data.timestamp.seconds : 0;
        return tb - ta;
      });
      var total = document.getElementById('cnt-all');
      if(total) total.textContent = allDocs.length;
      renderVisible();
    }
  }

  colKeys.forEach(function(col){
    function processSnap(snap){
      var count = 0;
      snap.forEach(function(doc){
        allDocs.push({col:col, id:doc.id, data:doc.data()});
        count++;
      });
      var cnt = document.getElementById('cnt-'+col);
      if(cnt) cnt.textContent = count;
      done();
    }
    function onErr(){
      var cnt = document.getElementById('cnt-'+col);
      if(cnt) cnt.textContent = 0;
      done();
    }
    db.collection(col).get()
      .then(processSnap)
      .catch(onErr);
  });
}

function exportCSV(){
  var selCol = document.getElementById('sel-form').value;
  var search = (document.getElementById('search-name').value || '').toLowerCase().trim();
  var filtered = allDocs.filter(function(r){
    if(selCol !== 'all' && r.col !== selCol) return false;
    if(search){
      var name = ((r.data.nome||r.data.name||r.data.participante||'')).toLowerCase();
      if(name.indexOf(search) === -1) return false;
    }
    return true;
  });

  if(filtered.length === 0){ alert('Nenhuma resposta para exportar.'); return; }

  // Gather all keys
  var allKeys = {};
  filtered.forEach(function(r){ Object.keys(r.data).forEach(function(k){ allKeys[k]=1; }); });
  var keys = ['_formulario','_id'].concat(Object.keys(allKeys));

  var csv = keys.map(function(k){ return '"'+k+'"'; }).join(',') + '\n';
  filtered.forEach(function(r){
    var row = keys.map(function(k){
      if(k==='_formulario') return '"'+badgeLabel(r.col)+'"';
      if(k==='_id') return '"'+r.id+'"';
      var v = r.data[k];
      if(v === undefined || v === null) return '""';
      if(v && v.toDate) v = v.toDate().toISOString();
      if(v && v.seconds) v = new Date(v.seconds*1000).toISOString();
      return '"'+String(v).replace(/"/g,'""')+'"';
    });
    csv += row.join(',') + '\n';
  });

  var blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'lider5_respostas_'+(new Date().toISOString().slice(0,10))+'.csv';
  a.click();
  URL.revokeObjectURL(url);
}
